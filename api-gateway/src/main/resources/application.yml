server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: orchestrator
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/payments/**
        - id: ledger
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/ledger/**
        - id: refund-dispute
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/refunds/**,/api/v1/disputes/**
        - id: payout-reconciliation
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payouts/**,/api/v1/reconciliation/**,/api/v1/merchants/**

payflow:
  auth:
    # HS256 secret - MUST be >= 32 bytes. Override via PAYFLOW_AUTH_SECRET in prod.
    secret: ${PAYFLOW_AUTH_SECRET:payflow-demo-signing-secret-please-rotate-me-01}
    token-ttl-seconds: 3600
    clients:
      merchant_acme_client:
        secret: s3cr3t
        merchant-id: merchant_acme

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
