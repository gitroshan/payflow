server:
  port: 8084

spring:
  application:
    name: payout-reconciliation-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow_payout
    username: payflow
    password: payflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payout-reconciliation-service

payflow:
  outbox:
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
