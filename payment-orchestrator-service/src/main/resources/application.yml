server:
  port: 8081

spring:
  application:
    name: payment-orchestrator-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow_orchestrator
    username: payflow
    password: payflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

payflow:
  gateway:
    base-url: http://localhost:8085
  outbox:
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
